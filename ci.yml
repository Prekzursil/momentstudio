name: Fullstack Web CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: fullstack-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-branch --cov-report=xml:coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: ui
        run: npm ci
      - name: Run frontend tests with coverage
        working-directory: ui
        run: npx vitest run --coverage

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run integration suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
python -m pip install -r backend/requirements.txt coverage pytest ruff mypy
npm --prefix frontend ci
make coverage
