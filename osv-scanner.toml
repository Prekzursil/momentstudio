# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# (per the reusable-quality.yml gate-deps step) over the repo's lockfiles
# (backend Python + frontend npm) and must report 0 actionable CVEs.
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not (Dependabot drives the upgrades).
#
# Lockfiles in this monorepo:
#   - backend/requirements.txt          (pinned Python deps)
#   - backend/requirements-ci.txt       (pinned Python CI deps)
#   - frontend/package-lock.json        (Angular/TypeScript npm tree)
#
# NOTE: because the gate passes `--config=osv-scanner.toml` explicitly, this ONE
# root file governs every lockfile scanned by `--recursive .`, including
# frontend/package-lock.json. It is not per-directory here.
#
# SCHEMA WARNING: inside [[IgnoredVulns]] only `id`, `ignoreUntil` and `reason`
# are valid keys. osv-scanner REJECTS THE ENTIRE FILE on any unknown key and then
# silently falls back to an EMPTY config (internal/config/config.go,
# tryLoadConfig -> "unknown keys in config file"), so a typo'd or invented field
# disables the ignore with no error. Extra context therefore lives in comments
# like these, never in extra keys. `ignoreUntil` is a bare TOML date, not a
# quoted string.
#
# ── ENTRY 1: GHSA-mrhx-c7xc-m3w5 (zod memory exhaustion) ────────────────────
# WHY IT EXISTS:
#   * Advisory: "Zod can exhaust memory while validating oversized constrained
#     collections"; fixed ONLY in 4.6.6 (affected range: introduced 0, fixed
#     4.6.6). No fixed 3.x release exists and none is coming — 3.25.76 is the
#     final 3.x line.
#   * The lock row is the zod 3.25.76 copy under @codecov/bundler-plugin-core
#     (^3.22.4, devDependency used for CI coverage upload). The root zod and
#     every range-flexible consumer were UPGRADED to 4.6.6 in this same change
#     (frontend/package.json overrides: "zod@^4": "4.6.6").
#   * Forcing the remaining ^3.22.4 consumer to zod 4 is a breaking major for
#     bundler-plugin-core internals; per the policy above this is the
#     "no non-breaking upgrade" case, not a blanket mute.
#   * Dev-scope only: coverage-upload tooling, not shipped to browsers or SSR
#     request paths, and does not validate attacker-supplied input.
#
# RE-CHECK ON EXPIRY: has @codecov/bundler-plugin-core shipped a release that
# accepts zod ^4 (then DELETE this entry and let the override cover it), or
# been dropped from devDependencies? If either is true, DELETE, do not extend.

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-31
reason = "zod memory-exhaustion while validating oversized constrained collections, fixed only in 4.6.6 (no fixed 3.x exists). Remaining row is the dev-only @codecov/bundler-plugin-core (^3.22.4) copy; every flexible consumer was upgraded to 4.6.6 in this change. Time-boxed to 2027-01-31; re-check for a zod-4-compatible codecov plugin."

# ── ENTRY 2: GHSA-g3hv-75wg-m249 (minimatch globparts amplification DoS) ────
# WHY IT EXISTS:
#   * Advisory: "minimatch has potential denial of service via globparts
#     amplification"; fixed ONLY in 11.0.1 (affected range: introduced 0,
#     fixed 11.0.1). No backport to 3.x or 10.x exists.
#   * Lock rows: minimatch 3.1.5 (pinned ^3 by eslint/eslintrc, karma,
#     resp-modifier and glob@7) and minimatch 10.2.5/10.2.6 (pinned ^10 by
#     glob@13-14 internals). All are devDependencies (lint/test tooling).
#   * Overriding every consumer to minimatch 11 is a double breaking major
#     (3 -> 11 for eslint 8 / karma) and risks silently changing glob-matching
#     semantics inside those tools; per the policy above this is the
#     "no non-breaking upgrade" case.
#   * Dev-scope only: lint/test-time pattern matching on first-party code, no
#     attacker-controlled patterns.
#
# RE-CHECK ON EXPIRY: have eslint/karma been replaced or shipped minimatch >=11
# pins (then DELETE this entry), or can the toolchain move to minimatch 11
# without a major migration? If yes, DELETE rather than extend.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch DoS via globparts amplification, fixed only in 11.0.1 (no 3.x/10.x backport). Rows are dev-only minimatch 3.1.5 (eslint 8/karma/resp-modifier) and 10.2.x (glob internals); forcing 11 on those is a breaking major migration. Time-boxed to 2027-01-31; re-check when eslint/karma toolchain moves to minimatch >=11."
