# Dev SSR overlay — exercise the REAL server-rendered frontend locally.
#
# Why this exists: `infra/docker-compose.yml` builds `frontend/Dockerfile`
# (nginx serving the static browser bundle), but PRODUCTION
# (`infra/prod/docker-compose.yml`) runs `frontend/Dockerfile.ssr`
# (`node dist/app/server/main.js`). So the default dev stack could never
# exercise SSR — meaning SEO/meta, no-FOUC, and the P1a SSR head-inline theme
# sink were all unverifiable locally. This overlay closes that gap.
#
# Usage (alongside the base compose):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.ssr.yml up -d --build
#
#   http://localhost:4201  -> static SPA (nginx)      [base compose]
#   http://localhost:4202  -> SSR app via edge proxy  [this overlay, prod-faithful]
#
# The `ssr-edge` proxy mirrors prod's Caddy routing: /api/v1/* -> backend,
# everything else -> the SSR node server. Without it the browser's API calls
# would 404, because the SSR server does not proxy the API itself.

services:
  frontend-ssr:
    build:
      context: ../
      dockerfile: frontend/Dockerfile.ssr
    env_file:
      - ../frontend/.env.example
    environment:
      SSR_API_BASE_URL: ${SSR_API_BASE_URL:-http://backend:8000/api/v1}
      API_BASE_URL: ${API_BASE_URL:-/api/v1}
      APP_ENV: ${APP_ENV:-production}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-1}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-1}
      NETOPIA_ENABLED: ${NETOPIA_ENABLED:-0}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  ssr-edge:
    image: nginx:1.29.5-alpine
    depends_on:
      - frontend-ssr
      - backend
    ports:
      - "4202:80"
    volumes:
      - ./ssr-edge.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
