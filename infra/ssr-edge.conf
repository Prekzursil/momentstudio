# Dev SSR edge proxy — mirrors production's Caddy routing so the SSR app is
# reachable on a single origin (API + app), which is what the browser requires.
#   /api/v1/*  -> backend (FastAPI)
#   /*         -> frontend-ssr (node dist/app/server/main.js)
# Used only by infra/docker-compose.ssr.yml. Not a production artifact.

server {
    listen 80;
    server_name _;

    # Large enough for media uploads exercised by admin flows.
    client_max_body_size 32m;

    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend-ssr:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
